name: Build macOS .app

# Builds dist/Clayrune.app, zips it to Clayrune-macOS-unsigned.zip, and either
# attaches the zip to the triggering release (release event) or uploads it as
# a workflow artifact (manual dispatch). Mirrors the Windows path so future
# Mac users can download → unzip → right-click → Open (Gatekeeper one-time)
# without a Terminal step.
#
# This CI build is UNSIGNED, and its asset name says so: Clayrune-macOS-unsigned.zip.
# The SHIPPING asset is Clayrune-macOS.zip — signed + notarized via
# tools/notarize-macos.sh (see docs/MACOS_NOTARIZATION.md) and uploaded by hand.
#
# The two names must stay distinct. The website's macOS button is the fixed URL
# .../releases/latest/download/Clayrune-macOS.zip and the page promises a
# notarized build, so CI must never occupy that filename with an unsigned zip.
# Corollary: EVERY published release needs the notarized Clayrune-macOS.zip
# uploaded, or that button 404s for every Mac visitor — which is what happened
# on v2.0.1 and v2.0.2 (found 2026-08-29, by a user).

on:
  workflow_dispatch:
  release:
    types: [published]

# The release-triggered GITHUB_TOKEN needs contents:write to `gh release upload`
# the built zip — without it the Attach step 403s ("Resource not accessible by
# integration"), which is why the asset never appeared on v2.0.0–v2.0.2.
permissions:
  contents: write

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install runtime deps (without pythonnet — Windows-only)
        run: |
          # pythonnet pulls .NET runtime stubs and fails to build on macOS.
          # Strip it out before pip install; app.py guards all pythonnet
          # imports behind `if sys.platform == 'win32'`.
          grep -v '^pythonnet' requirements.txt > /tmp/requirements-macos.txt
          pip install -r /tmp/requirements-macos.txt
          # pywebview on macOS needs pyobjc-core + pyobjc-framework-Cocoa /
          # WebKit. The pywebview wheel doesn't declare them as hard deps,
          # so we install them explicitly here.
          pip install pyobjc-core pyobjc-framework-Cocoa pyobjc-framework-WebKit
          # Pillow lets PyInstaller auto-convert the .png icon to .icns at
          # BUNDLE time. Without it, BUNDLE() raises ValueError on the icon
          # parameter and the build fails right at the .app assembly step.
          pip install pyinstaller pillow

      - name: Build .app
        run: |
          pyinstaller installer/build-macos.spec --noconfirm
          ls -la dist/

      - name: Smoke-test bundle structure
        run: |
          test -d "dist/Clayrune.app" || (echo "Clayrune.app missing"; exit 1)
          test -f "dist/Clayrune.app/Contents/MacOS/Clayrune" || (echo "binary missing"; exit 1)
          test -d "dist/Clayrune.app/Contents/Resources" || (echo "Resources missing"; exit 1)
          du -sh "dist/Clayrune.app"

      - name: Zip the bundle
        run: |
          cd dist
          # ditto preserves macOS extended attributes (xattrs) so the
          # zipped .app re-launches cleanly. zip(1) loses them.
          ditto -c -k --sequesterRsrc --keepParent Clayrune.app Clayrune-macOS-unsigned.zip
          ls -lh Clayrune-macOS-unsigned.zip

      - name: Upload as workflow artifact (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Clayrune-macOS-unsigned
          path: dist/Clayrune-macOS-unsigned.zip
          retention-days: 14

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/Clayrune-macOS-unsigned.zip --clobber
