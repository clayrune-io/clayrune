name: Install smoke test

# Runs the live clayrune.io/install.sh against a clean Ubuntu + macOS runner
# to validate the end-to-end install flow.
#
# Why this exists: brand-new-Mac surprises like ~/.local/bin not being on
# PATH, nvm sourcing only landing in ~/.bashrc on a zsh-default machine,
# and Anthropic's curl-installer dropping claude somewhere fresh shells
# can't find — those were all caught only when Keegan tried to install on
# 2026-05-25 and pasted three rounds of broken output. This workflow turns
# that feedback loop into seconds, on every push to installer/.
#
# Auth-gated steps are NOT exercised here — the runner can't OAuth into
# Claude. We just verify install.sh gets THROUGH the install-and-PATH-fix
# phase and that a fresh login shell can still find `claude`.

# Least privilege: these workflows only read the repo. Without an explicit
# block they inherit the org/repo default, which can be write-all.
permissions:
  contents: read

on:
  push:
    paths:
      - 'installer/install.sh'
      - 'installer/_headers'
      - '.github/workflows/install-smoke.yml'
  pull_request:
    paths:
      - 'installer/install.sh'
  workflow_dispatch:

concurrency:
  group: install-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run install.sh from clayrune.io (auth-gated parts will exit 3)
        env:
          CLAYRUNE_NO_CONFIRM: '1'
        run: |
          set +e
          curl -sSL https://clayrune.io/install.sh | sh
          ec=$?
          # install.sh stops at the auth check (we can't OAuth in CI). That's
          # expected and acceptable — anything before that point must have
          # succeeded.
          #
          # 3 is the CURRENT contract: install.sh:363 exits 3 for "installed
          # but not authenticated", deliberately matching install.ps1. It used
          # to exit 1, and this gate was never updated when the code changed —
          # see the note in the `macos` job below for why that went unnoticed
          # for two weeks. 1 stays accepted so an older deployed install.sh
          # doesn't fail the run.
          if [ "$ec" -ne 0 ] && [ "$ec" -ne 1 ] && [ "$ec" -ne 3 ]; then
            echo "install.sh exited $ec — unexpected"
            exit "$ec"
          fi
          echo "install.sh reached the auth gate (exit $ec) — install phase OK"

      - name: Verify claude binary is reachable from a fresh login shell
        run: |
          # `bash -lc` simulates a brand-new terminal — must source the rc
          # files install.sh just modified. If our PATH-persist logic
          # works, `claude --version` succeeds here.
          bash -lc 'command -v claude && claude --version' || {
            echo "FAIL: fresh login shell can't find claude — PATH persistence broken"
            echo "Dumping rc files:"
            for f in ~/.bashrc ~/.bash_profile ~/.profile; do
              if [ -f "$f" ]; then echo "--- $f ---"; cat "$f"; fi
            done
            exit 1
          }

  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Run install.sh from clayrune.io
        env:
          CLAYRUNE_NO_CONFIRM: '1'
        shell: zsh -l {0}
        run: |
          set +e
          curl -sSL https://clayrune.io/install.sh | sh
          ec=$?
          # See the ubuntu job: 3 = "installed but not authenticated".
          #
          # THIS JOB TESTS THE DEPLOYED SITE, NOT THE CHECKOUT — it curls
          # install.sh from clayrune.io. So it goes red when the LIVE script
          # and this contract disagree, which can happen with no commit to
          # install.sh at all: the exit-1 -> exit-3 change landed in ee9c152
          # (2026-07-24), reached clayrune.io on a later site deploy, and only
          # surfaced on 2026-08-07 when an unrelated `installer/_headers`
          # commit next tripped this workflow's path filter. Don't read a
          # failure here as "the last commit broke the installer" — check the
          # deployed script's exit code first.
          if [ "$ec" -ne 0 ] && [ "$ec" -ne 1 ] && [ "$ec" -ne 3 ]; then
            echo "install.sh exited $ec — unexpected"
            exit "$ec"
          fi
          echo "install.sh reached the auth gate (exit $ec) — install phase OK"

      - name: Verify claude reachable from a fresh zsh login shell
        shell: zsh -l {0}
        run: |
          # zsh -l reads ~/.zshrc — the file install.sh's PATH-persist
          # code is supposed to have modified. If our logic works here,
          # `claude --version` succeeds.
          command -v claude || {
            echo "FAIL: fresh zsh login shell can't find claude on PATH"
            echo "Dumping ~/.zshrc:"
            [ -f ~/.zshrc ] && cat ~/.zshrc || echo "(.zshrc does not exist)"
            echo "Searching common install dirs:"
            ls -la ~/.local/bin/claude ~/.claude/bin/claude ~/.npm-global/bin/claude /usr/local/bin/claude /opt/homebrew/bin/claude 2>&1 | head -10
            exit 1
          }
          claude --version

  macos-no-python:
    # Same as `macos` but with every modern Python and Homebrew taken away, so
    # the uv-fallback branch in Step 2/5 is actually exercised. macos-latest
    # ships preinstalled Pythons, which short-circuit the auto-install path
    # entirely — without this scenario a uv-path regression would sail through
    # CI and only break in production (caught Keegan's MBP only because brew
    # was also missing).
    #
    # 2026-09-02: this job was red from ~2026-06-09 and was parked
    # non-blocking, blamed on uv drifting its install location. That was
    # wrong — uv is fine, and the job never reached it. The old version hid
    # Python by STRIPPING PATH entries, but install.sh's
    # _refresh_claude_path() unconditionally re-prepends /usr/local/bin (plus
    # ~/.local/bin, ~/.claude/bin, ~/.npm-global/bin and
    # `npm config get prefix`/bin) so a just-installed `claude` is reachable
    # without opening a new shell. The runner keeps a python3.12 in
    # /usr/local/bin, so the installer handed that dir straight back, Step 2/5
    # logged "Using: python3.12 (Python 3.12.10)", the uv branch never ran, and
    # the assertion three steps later failed on a missing ~/.local/bin/uv —
    # which reads like a uv bug and is not one.
    #
    # So: hide the interpreters ON DISK. PATH is not ours to control once
    # install.sh is running. And assert the uv branch actually executed, so a
    # future leak fails with that sentence instead of a misleading one.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Take every modern Python and Homebrew away from the runner
        shell: zsh -l {0}
        run: |
          set -e
          # Keep the system dirs intact: /usr/bin holds curl, git and sed, and
          # Apple's python3 — which is 3.9, too old for install.sh's 3.11+
          # check. That stub staying reachable IS the state we simulate. Every
          # other PATH dir gets its python/brew binaries moved aside, where no
          # amount of PATH rebuilding inside install.sh can reach them.
          hidden="$RUNNER_TEMP/hidden-toolchain"
          mkdir -p "$hidden"
          echo "$PATH" | tr ':' '\n' | while IFS= read -r d; do
            [ -n "$d" ] || continue
            case "$d" in
              /usr/bin|/bin|/usr/sbin|/sbin|/System/*|/Library/Apple/*|/var/run/com.apple.*) continue ;;
            esac
            # Enumerate by name rather than globbing: this step runs under
            # zsh, where an unmatched glob is a fatal error, not a literal.
            ls -1 "$d" 2>/dev/null | grep -E '^(python|python3|python3\.[0-9]+|brew)$' | while IFS= read -r n; do
              sudo mv "$d/$n" "$hidden/$(echo "$d/$n" | tr '/.' '__')" && echo "  hid $d/$n"
            done
          done
          hash -r 2>/dev/null || true

          echo "--- toolchain visible to the installer:"
          echo "curl:  $(command -v curl || echo '(MISSING — bad)')"
          echo "brew:  $(command -v brew || echo '(missing — good)')"
          echo "python3: $(command -v python3 || echo '(none)')"

          # Assert the simulation actually holds, HERE, where the message is
          # about the simulation. Anything install.sh's _find_python() would
          # accept must now live only in /usr/bin or /bin.
          for c in python3.12 python3.11 python3 python; do
            p=$(command -v "$c" 2>/dev/null) || continue
            case "$p" in
              /usr/bin/*|/bin/*) ;;
              *) echo "FAIL: $c is still reachable at $p — simulation leaked"; exit 1 ;;
            esac
          done
          # ...and the system stub must stay too old to satisfy the 3.11+
          # check, or this job silently stops testing the uv path.
          sysver=$(/usr/bin/python3 --version 2>&1 || echo none)
          echo "system python3: $sysver"
          case "$sysver" in
            *' 3.9.'*|*' 3.10.'*) ;;
            *) echo "FAIL: /usr/bin/python3 is '$sysver' — new enough for install.sh, so the uv branch can never run. Rework this job."; exit 1 ;;
          esac

      - name: Run install.sh with no usable Python and no Homebrew
        env:
          CLAYRUNE_NO_CONFIRM: '1'
          # Skip the OAuth gate so the test reaches Step 2/5 (Python/uv).
          # install.sh respects this only when set; production never does.
          CLAYRUNE_SKIP_AUTH_CHECK: '1'
        shell: zsh -l {0}
        run: |
          set +e
          log="$RUNNER_TEMP/install.log"
          { curl -sSL https://clayrune.io/install.sh | sh; echo "__INSTALL_EC__=$?"; } 2>&1 | tee "$log"
          ec=$(grep -o '__INSTALL_EC__=[0-9]*' "$log" | tail -1 | cut -d= -f2)
          # With CLAYRUNE_SKIP_AUTH_CHECK we expect install.sh to run ALL the
          # way through (clone, venv, launcher, server start). Server-start may
          # fail in CI (no display) but the venv setup — Step 2/5, the uv path
          # we are actually testing — must complete before that point.
          if [ "$ec" != "0" ] && [ "$ec" != "1" ] && [ "$ec" != "2" ]; then
            echo "install.sh exited $ec — unexpected"
            exit "${ec:-1}"
          fi
          # The point of this job is the uv branch. Prove it RAN. Without this
          # line a leaky simulation surfaces later as "uv binary missing",
          # which sent us chasing uv for three months.
          grep -q 'installing Python via uv' "$log" || {
            echo "FAIL: install.sh did NOT take the uv fallback — it found a Python or a brew we thought we had hidden."
            grep -nE 'Using:|Homebrew|STEP 2/5' "$log" || true
            exit 1
          }
          echo "install.sh exit $ec — uv fallback confirmed, checking artifacts"

      - name: Verify uv installed a Python and the venv is built on it
        shell: zsh -l {0}
        run: |
          # uv installs its interpreters into ~/.local/share/uv/python/.
          ls -la ~/.local/bin/uv 2>&1 || { echo "FAIL: uv binary missing"; exit 1; }
          ~/.local/bin/uv python list --only-installed 2>&1 | head -5
          test -x "$HOME/Clayrune/.venv/bin/python" || {
            echo "FAIL: venv python missing — install.sh's Step 2 didn't complete"
            ls -la "$HOME/Clayrune/.venv/bin/" 2>&1 || true
            exit 1
          }
          "$HOME/Clayrune/.venv/bin/python" --version
          # The venv must be built ON uv's interpreter. A venv alone only
          # proves Step 2 finished, not that it finished via uv.
          venv_home=$(grep -E '^home' "$HOME/Clayrune/.venv/pyvenv.cfg" 2>/dev/null || echo '')
          echo "pyvenv.cfg $venv_home"
          case "$venv_home" in
            *.local/share/uv/python*) ;;
            *) echo "FAIL: venv was not built on uv's Python"; exit 1 ;;
          esac
